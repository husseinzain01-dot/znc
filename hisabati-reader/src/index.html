<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>لوحة المحل</title>
<link rel="icon" href="/*FAVICON*/">
<style>/*FONTS*/</style>
<style>/*STYLES*/</style>
</head>
<body>

<!-- full-screen states: loading, first-run setup, sign-in, read-only welcome -->
<div class="screen" id="screen">
  <div class="screen-card" id="screenCard">
    <div class="brand-mark big" aria-hidden="true">/*LOGO*/</div>
    <h1>لوحة المحل</h1>
    <p class="muted">جاري التشغيل…</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="brand-mark" aria-hidden="true">/*LOGO*/</div>
      <div class="side-brand-text">
        <b id="shopTitle">لوحة المحل</b>
        <small id="fileStatus"></small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="who" hidden>
        <span class="avatar" id="whoAvatar"></span>
        <span class="who-text"><b id="whoName"></b><small id="whoRole"></small></span>
        <button class="icon-btn" id="btnLogout" title="تسجيل خروج" aria-label="تسجيل خروج"></button>
      </div>
      <div class="sync">
        <button class="btn ghost small" id="btnReload"></button>
        <label class="check small" id="autoWrap"><input type="checkbox" id="auto"> تحديث تلقائي</label>
      </div>
      <button class="btn small ghost" id="btnOpen" hidden>فتح ملف ثاني</button>
      <input type="file" id="fileInput" accept=".accdb,.mdb" hidden>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="content">
    <header class="page-head no-print">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="القائمة"></button>
      <div class="page-title">
        <h1 id="pageTitle"></h1>
        <p id="pageSub" class="muted"></p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </header>

    <section class="filters no-print" id="filters" hidden>
      <div class="seg" id="presets">
        <button data-p="today">اليوم</button>
        <button data-p="yesterday">أمس</button>
        <button data-p="week">آخر 7 أيام</button>
        <button data-p="month">هذا الشهر</button>
        <button data-p="all">الكل</button>
      </div>
      <label>من <input type="date" id="from"></label>
      <label>إلى <input type="date" id="to"></label>
      <label>المستخدم <select id="user"><option value="">الكل</option></select></label>
    </section>

    <div id="main" class="main"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="close no-print" id="modalClose" aria-label="سد">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>/*SCRIPT*/</script>
</body>
</html>
